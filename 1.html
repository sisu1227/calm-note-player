<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calm Note - Track 1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      overflow: hidden;
    }
    .player {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 300px;
    }
    h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      font-weight: 600;
    }
    audio {
      width: 100%;
      border-radius: 10px;
      outline: none;
      margin-top: 10px;
    }
    .track-info {
      font-size: 0.9em;
      margin-top: 10px;
      color: #ddd;
    }
    .track-info span {
      display: block;
    }
  </style>
</head>
<body>
  <div class="player">
    <h2>Relaxing Track 1</h2>
    <audio controls autoplay>
      <source src="track1.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
    <div class="track-info">
      <span>هنرمند: Calm Note</span>
      <span>ژانر: آرامش‌بخش</span>
      <span>مدت زمان: 3:45</span>
    </div>
  </div>
</body>
</html>
