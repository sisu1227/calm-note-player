<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calm Note - Track 1</title>
  <style>
    body {
      background: url('https://raw.githubusercontent.com/sisu1227/calm-note-player/main/images/back.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      position: relative; /* برای قرار دادن لوگو در گوشه */
    }
    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      max-width: 120px;
    }
    .player {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .player img {
      max-width: 120px;
      width: 100%;
      margin-bottom: 20px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <!-- لوگو در گوشه سمت راست بالا -->
  <img class="logo" src="https://raw.githubusercontent.com/sisu1227/calm-note-player/main/images/logo.png" alt="Logo">

  <div class="player">
    <h2>Relaxing Track 1</h2>
    <audio controls autoplay>
      <source src="track1.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>
</body>
</html>
