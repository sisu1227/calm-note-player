<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calm Note - Track 1</title>
  <style>
    body {
      background: url('https://source.unsplash.com/1600x900/?nature,relax') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: white;
    }

    .player {
      background: rgba(0, 0, 0, 0.6); /* Transparent black background */
      padding: 40px 60px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      transform: scale(0.9);
      animation: fadeIn 1.5s ease-out;
    }

    .player h2 {
      font-size: 32px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 10px;
      height: 50px;
      transition: all 0.3s ease;
    }

    audio:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="player">
    <h2>Relaxing Track 1</h2>
    <audio controls autoplay>
      <source src="track1.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>
</body>
</html>
