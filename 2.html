<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calm Note - Track 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Sacramento&display=swap" rel="stylesheet">
  <link href="https://cdn.fontcdn.ir/fontiran/vazir/fontiran-vazir.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to top, #f6e3d1, #eaf6fb, #a8d6eb, #cbe9f6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: auto;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .player {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      transition: transform 0.3s ease-in-out;
      animation: slideUp 1s ease-out;
      border: none;
      background-color: transparent;
      box-shadow: none;
      margin-top: 250px;
      margin-bottom: 50px;
    }

    .player:hover {
      transform: translateY(-10px);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player h2 {
      display: none;
    }

    .player audio {
      width: 100%;
      border-radius: 5px;
      background: transparent;
      padding: 5px;
      border: none;
    }

    .player audio::-webkit-media-controls {
      background: transparent;
      border-radius: 5px;
    }

    .focus-notes {
      font-family: 'Sacramento', cursive;
      font-size: 72px;
      color: #5e5c5c;
      margin-top: 120px;
    }

    .slogan {
      font-family: 'Vazir', sans-serif; /* تغییر فونت به Vazir */
      font-size: 48px;
      font-weight: 500;
      color: #4a4a4a;
      text-align: center;
      margin-top: 20px;
    }

  </style>
  <link rel="icon" href="https://sisu1227.github.io/calm-note-player/favicon.ico" type="image/x-icon">
</head>
<body>
  <img class="logo" src="https://sisu1227.github.io/calm-note-player/logo.png" alt="Logo">

  <div class="focus-notes">Focus Notes</div>

  <div class="player">
    <audio controls autoplay>
      <source src="track2.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>

  <div class="slogan">خوراک ذهنت، ملودی روزت</div>
</body>
</html>
