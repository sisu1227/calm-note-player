<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calm Note - Track 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to top, #f6e3d1, #eaf6fb, #a8d6eb, #cbe9f6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* خطوط هنری محو شبیه به موج‌های صوتی */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(transparent, transparent 4px, rgba(0, 0, 0, 0.05) 4px, rgba(0, 0, 0, 0.05) 6px);
      background-size: 100% 50px;
      opacity: 0.1;
    }

    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 90px;
      height: auto;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .player {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
      transition: transform 0.3s ease-in-out;
      animation: slideUp 1s ease-out;
      border: none; /* حذف کادر دور پلیر */
    }

    .player:hover {
      transform: translateY(-10px);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
      font-weight: 500;
    }

    .player audio {
      width: 100%;
      border-radius: 5px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      padding: 5px;
      border: none; /* حذف حاشیه */
    }

    .player audio::-webkit-media-controls {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border-radius: 5px;
    }

  </style>
  <link rel="icon" href="https://sisu1227.github.io/calm-note-player/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- لوگو در گوشه سمت راست بالا -->
  <img class="logo" src="https://sisu1227.github.io/calm-note-player/logo.png" alt="Logo">

  <div class="player">
    <h2>Relaxing Track 1</h2>
    <audio controls autoplay>
      <source src="track2.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>
</body>
</html>
