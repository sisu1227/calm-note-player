<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calm Note - Track 1</title>
  <style>
    body {
      background: linear-gradient(to top, #f6e3d1, #a8d6eb);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Iranian Sans', sans-serif;
      position: relative;
    }
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px; 
      height: auto;
    }
    .title {
      font-family: 'Cursive', sans-serif;
      font-size: 3em;
      margin-top: 60px;
      text-align: center;
    }
    .player {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 600px;
      width: 100%;
      padding-bottom: 30px;
      margin-top: 100px;
    }
    .player audio {
      width: 100%;
    }
    .farsi-text {
      font-family: 'Vazir', sans-serif;
      font-size: 2em;
      color: #2c3e50;
      position: absolute;
    }
    .farsi-text.left {
      left: 20px;
      bottom: 20px;
    }
    .farsi-text.right {
      right: 20px;
      bottom: 20px;
    }
  </style>
  <link rel="icon" href="https://sisu1227.github.io/calm-note-player/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- لوگو در گوشه سمت راست بالا -->
  <img class="logo" src="https://sisu1227.github.io/calm-note-player/logo.png" alt="Logo">

  <div class="title">Focus Notes</div>

  <div class="player">
    <audio controls autoplay>
      <source src="track2.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>

  <!-- متن فارسی در دو سمت -->
  <div class="farsi-text left">خوراک ذهنت</div>
  <div class="farsi-text right">ملودی روزت</div>
</body>
</html>
