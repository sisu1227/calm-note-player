<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calm Note - Track 1</title>
  <style>
    body {
      background: url('https://sisu1227.github.io/calm-note-player/back.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      position: relative; /* برای قرار دادن لوگو در گوشه */
    }
    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 80px; /* تغییر اندازه لوگو */
      height: auto;
    }
    .player {
      background: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 600px; /* افزایش عرض حداکثری پلیر */
      width: 100%;
      padding-bottom: 30px; /* فاصله پایین پلیر */
    }
    .player h2 {
      font-size: 24px; /* تنظیم اندازه فونت عنوان */
      margin-bottom: 20px;
    }
    .player audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- لوگو در گوشه سمت راست بالا -->
  <img class="logo" src="https://sisu1227.github.io/calm-note-player/logo.png" alt="Logo">

  <div class="player">
    <h2>Relaxing Track 1</h2>
    <audio controls autoplay>
      <source src="track2.mp3" type="audio/mpeg">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  </div>
</body>
</html>
